services:
  # PostgreSQL + pgvector — for semantic skill search (skill_embeddings table)
  orchestrai-postgres:
    image: pgvector/pgvector:pg16
    container_name: orchestrai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orchestrai123
      POSTGRES_DB: orchestrai_serp
    volumes:
      - orchestrai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrai_serp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orchestrai-network

  # Trigger System (Phase 2)
  trigger-system:
    build:
      context: .
      dockerfile: orchestrai-trigger-system/Dockerfile
    container_name: orchestrai-triggers
    restart: unless-stopped
    ports:
      - "5502:5502"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TRIGGER_PORT=5502
      - MAX_CONCURRENT=5
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
    networks:
      - orchestrai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5502/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

