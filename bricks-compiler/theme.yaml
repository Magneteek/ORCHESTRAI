    mobile: 16px
    desktop: 18px
    fluid: "clamp(1.6rem, calc(0.2174vw + 1.5217rem), 1.8rem)"  # --text-m / --text-base
  heading:
    scale: 1.333  # Major-Third (desktop)
    scale_mobile: 1.2  # (mobile)
    weight: 600
    text_transform: uppercase
    letter_spacing: 0.1em
    sizes:
      h6: "clamp(1.6rem, calc(0.2174vw + 1.5217rem), 1.8rem)"  # 16.0px → 18.0px
      h5: "clamp(1.92rem, calc(0.5211vw + 1.7324rem), 2.3994rem)"  # 19.2px → 24.0px
