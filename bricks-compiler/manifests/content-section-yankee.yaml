# Content Section Yankee
# Long-form content grid: heading + rich text + media + stat cards row
# AUTO-GENERATED skeleton, manually corrected
# Source: https://krisbal.com (Bricks 2.3.5)

component: content-section-yankee
version: "2.3.5"
description: |
  Two-column layout: left side has a large heading and main content text;
  right side has an image. Below both columns, a row of 2–5 social-proof stat cards.

slots:

  # ── Content column ─────────────────────────────────────────────────────────

  heading:
    type: string
    required: true
    max_length: 100
    target_class: content-grid-yankee__heading
    description: Large H2 heading (runs through the heading-line animation)

  content:
    type: html
    required: true
    target_class: content-grid-yankee__content
    description: Rich text body paragraphs

  # ── Media column ──────────────────────────────────────────────────────────

  media:
    type: media
    required: true
    target_class: content-grid-yankee__media
    description: Hero / feature image alongside the content

  # ── Stat cards (array) ────────────────────────────────────────────────────

  stats:
    type: array
    required: false
    min: 2
    max: 5
    template_label: "Card"
    description: Social-proof stat cards — each shows a big value + short description
    item_slots:
      value:
        type: string
        required: true
        max_length: 30
        target_class: social-proof-yankee__card-value
        description: Bold metric (e.g. "$1.3 Trillion", "40% Decrease")
      description:
        type: string
        required: true
        max_length: 120
        target_class: social-proof-yankee__card-description

# ── Builder-only elements ─────────────────────────────────────────────────
strip_elements:
  - name: fr-notes
  - label: "Headline Line Styles"   # Frames JS animation — splits heading into word-spans,
                                    # causes massive section height. Strip it; heading renders fine.