# Content Section Seva
# Dark background section. Large heading + body text top-left (on a 12-col grid,
# heading spans cols 1–8, content spans cols 7–12 on row 2).
# Below: auto-scrolling infinite carousel of person cards (photo + name + title).
# Cards are fixed-width (min(33vw, 220px)) and loop continuously.
# Best for: client logos, team photos, quick social proof faces.

component: content-section-seva
version: "2.3.5"
description: |
  Dark-bg section with overlapping grid layout. Large H1-scale heading top-left,
  body text offset right (row 2). Below: breakout auto-scrolling infinite carousel
  of person cards (photo + name + title). 8 slides in template — compiler fills all 8.

slots:

  # ── Heading + body ─────────────────────────────────────────────────────────

  heading:
    type: string
    required: true
    max_length: 120
    target_class: content-section-seva__heading
    description: Large H2 (scaled to ~1.5× --h1). Aim for 2–3 lines. Light text on dark bg.

  content:
    type: html
    required: false
    target_class: content-section-seva__content
    description: Body text below/right of heading. Larger font-size (--text-l).

  # ── Carousel slides ────────────────────────────────────────────────────────
  # 8 fixed person card slots. Each card: photo + name + title.
  # Targeted by element ID because all cards share the same CSS classes.
  # The slider loops infinitely (autoScroll). All 8 slots should be filled.

  slide_1_image:
    type: media
    required: false
    target_id: "ddef21"
    description: Person photo 1 (square crop recommended)

  slide_1_name:
    type: string
    required: false
    max_length: 60
    target_id: "cc1066"
    description: Person name 1

  slide_1_title:
    type: string
    required: false
    max_length: 80
    target_id: "9e5522"
    description: Person role/title 1

