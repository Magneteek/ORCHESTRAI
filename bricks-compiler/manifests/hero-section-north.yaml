# Hero Section North (CSS)
# Dark-bg hero: 8-image mosaic above, centered text+CTAs, stat bar below.
# Source: https://krisbal.com (Bricks 2.3.5)

component: hero-section-north
version: "2.3.5"
description: |
  Full-width dark hero. Top: two rows of 4 static images. Center overlay: accent
  label, H1 heading, lede, primary + secondary CTAs. Bottom inner bar: supporting
  lede text + a row of 3 stat cards (value + description each).
  The 8 background images all share a single CSS class — replace them manually
  in Bricks after pasting (not individually slot-fillable).

slots:

  # ── Center content ────────────────────────────────────────────────────────

  heading:
    type: string
    required: true
    max_length: 80
    target_class: intro-foxtrot__heading
    description: H1 hero heading

  accent_heading:
    type: string
    required: false
    max_length: 60
    target_class: intro-foxtrot__accent-heading
    description: Small accent label above the heading

  lede:
    type: string
    required: false
    max_length: 220
    target_class: intro-foxtrot__lede
    description: Intro paragraph below the heading (center overlay)

  # ── CTAs ──────────────────────────────────────────────────────────────────

  primary_cta_text:
    type: string
    required: false
    max_length: 40
    target_class: btn--primary
    description: Primary button label

  primary_cta_link:
    type: link
    required: false
    target_class: btn--primary
    description: "Primary button URL: { url: '...', type?: 'external' }"

  secondary_cta_text:
    type: string
    required: false
    max_length: 40
    target_class: fr-cta-links-bravo__link
    description: Secondary CTA text (plain link style, not a button)

  secondary_cta_link:
    type: link
    required: false
    target_class: fr-cta-links-bravo__link
    description: "Secondary CTA URL: { url: '...', type?: 'external' }"

  # ── Bottom bar ────────────────────────────────────────────────────────────

  bottom_lede:
    type: html
    required: false
    target_class: hero-north__lede
    description: Supporting paragraph in the bottom bar (can include <b> for emphasis)

  # ── Stat cards (array) ────────────────────────────────────────────────────

  stats:
    type: array
    required: false
    min: 3
    max: 3
    template_label: "Stat Card"
    description: Three social-proof stats displayed in the bottom bar
    item_slots:
      value:
        type: string
        required: true
        max_length: 30
        target_class: hero-north__stat-card-stat
        description: Bold metric (e.g. "170,000+", "94%")
      description:
        type: string
        required: true
        max_length: 100
        target_class: hero-north__stat-card-description
        description: Short explanation of the metric

# ── Notes on image mosaic ─────────────────────────────────────────────────
# 8 images (2 rows × 4 cols) all share class image-group-north__image.
# Replace them manually in the Bricks editor after pasting.
# Recommended: landscape images of consistent ratio.

# ── Builder-only elements ─────────────────────────────────────────────────
strip_elements:
  [] # none detected
