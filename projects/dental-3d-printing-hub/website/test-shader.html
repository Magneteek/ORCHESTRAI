<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Dental Shader Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            overflow: hidden;
        }
        
        #dental-hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .test-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        
        .webgl-support {
            background: rgba(0, 255, 0, 0.2);
        }
        
        .no-webgl {
            background: rgba(255, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="dental-hero-canvas"></canvas>
    
    <div class="test-overlay">
        <h1>WebGL Dental Shader Test</h1>
        <div id="webgl-status" class="status">
            Testing WebGL support...
        </div>
        <div id="shader-status" class="status">
            Initializing shader...
        </div>
        <div id="performance-info" class="status">
            Performance: Testing...
        </div>
    </div>

    <script>
        // Test WebGL support
        function testWebGLSupport() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            return gl !== null;
        }

        // Update status display
        function updateStatus(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${isSuccess ? 'webgl-support' : 'no-webgl'}`;
        }

        // Initialize test
        window.addEventListener('DOMContentLoaded', () => {
            if (testWebGLSupport()) {
                updateStatus('webgl-status', '✅ WebGL is supported', true);
                
                // Performance monitoring
                let frameCount = 0;
                let lastTime = performance.now();
                
                const monitorPerformance = () => {
                    frameCount++;
                    const currentTime = performance.now();
                    
                    if (currentTime - lastTime >= 1000) {
                        const fps = Math.round(frameCount * 1000 / (currentTime - lastTime));
                        updateStatus('performance-info', `FPS: ${fps} | Performance: ${fps >= 30 ? 'Good' : 'Needs Optimization'}`, fps >= 30);
                        frameCount = 0;
                        lastTime = currentTime;
                    }
                    
                    requestAnimationFrame(monitorPerformance);
                };
                
                monitorPerformance();
                
                // Test shader initialization after a delay
                setTimeout(() => {
                    if (window.dentalHeroShader && window.dentalHeroShader.isInitialized) {
                        updateStatus('shader-status', '✅ Dental Hero Shader initialized successfully', true);
                    } else {
                        updateStatus('shader-status', '❌ Shader initialization failed', false);
                    }
                }, 2000);
                
            } else {
                updateStatus('webgl-status', '❌ WebGL not supported - CSS fallback active', false);
                updateStatus('shader-status', 'Using CSS animation fallback', false);
                updateStatus('performance-info', 'CSS Animation Performance', true);
            }
        });
    </script>
    
    <!-- Load the dental hero shader -->
    <script src="assets/js/dental-hero-shader.js"></script>
</body>
</html>
